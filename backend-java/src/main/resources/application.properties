# AI Reader V2 Backend Configuration

# Server Configuration
server.port=8000
spring.application.name=ai-reader-v2

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:./data/ai_reader.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# LLM Configuration
aireader.llm.provider=ollama
aireader.llm.model=qwen3:8b
aireader.ollama.base-url=http://localhost:11434
aireader.ollama.timeout=600000

# Cloud LLM Configuration
aireader.cloud.provider=openai
aireader.cloud.api-key=
aireader.cloud.base-url=
aireader.cloud.model=

# Data Directory
aireader.data.dir=./data

# Logging Configuration
logging.level.root=INFO
logging.level.com.aireader=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
